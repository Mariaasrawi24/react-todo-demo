name: Security Scan

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  security-scan:
    runs-on: self-hosted

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install TruffleHog
        run: |
          curl -sSfL https://raw.githubusercontent.com/trufflesecurity/trufflehog/main/scripts/install.sh | sh -s -- -b "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: TruffleHog secret scan
        run: |
          trufflehog git file://"$GITHUB_WORKSPACE" --branch main --only-verified

       - name: Install Bandit
        run: |
          python3 -m venv .bandit-venv
          . .bandit-venv/bin/activate
          pip install bandit

      - name: Bandit SAST scan
        run: |
          . .bandit-venv/bin/activate
          bandit -r backend/app

      - name: Hadolint backend Dockerfile
        run: |
          docker run --rm \
            -i hadolint/hadolint < backend/Dockerfile

      - name: Hadolint database Dockerfile
        run: |
          docker run --rm \
            -i hadolint/hadolint < db/Dockerfile

      - name: Hadolint frontend Dockerfile
        run: |
          docker run --rm \
            -i hadolint/hadolint < frontend/Dockerfile

      - name: Build frontend image
        run: docker compose build frontend

      - name: Build backend image
        run: docker compose build backend

      - name: Build database image
        run: docker compose build db

      - name: Trivy frontend image scan
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy:latest image \
            react-todo-demo-frontend

      - name: Trivy backend image scan
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy:latest image \
            react-todo-demo-backend

      - name: Trivy database image scan
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy:latest image \
            react-todo-demo-db
#security pipeline verification run
